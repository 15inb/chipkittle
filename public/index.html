<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chipkittle</title>
  <style>
    :root {
      color-scheme: light;
      --text: #10171c;
      --muted: rgba(16, 23, 28, 0.64);
      --glass: rgba(255, 255, 255, 0.58);
      --glass-strong: rgba(255, 255, 255, 0.76);
      --line: rgba(16, 23, 28, 0.14);
      --accent: #1f8d3a;
      --accent-bright: #78e043;
      --panel-text: #ffffff;
      --shadow: 0 24px 80px rgba(16, 23, 28, 0.18);
      --base:
        radial-gradient(circle at 58% 43%, rgba(115, 232, 75, 0.42), transparent 15rem),
        radial-gradient(circle at 100% 0%, rgba(92, 115, 119, 0.34), transparent 34rem),
        linear-gradient(118deg, #fafaf4 0%, #e9eee8 44%, #aebabe 100%);
      --veil:
        linear-gradient(90deg, rgba(250, 250, 244, 0.96) 0%, rgba(250, 250, 244, 0.78) 38%, rgba(250, 250, 244, 0.2) 70%, transparent 100%);
      --constellation: rgba(255, 255, 255, 0.32);
      --thread: rgba(31, 141, 58, 0.16);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --text: #f4fff4;
      --muted: rgba(244, 255, 244, 0.68);
      --glass: rgba(4, 17, 13, 0.58);
      --glass-strong: rgba(8, 28, 20, 0.74);
      --line: rgba(123, 255, 89, 0.16);
      --accent: #73e84b;
      --accent-bright: #baff84;
      --panel-text: #06110d;
      --shadow: 0 24px 90px rgba(0, 0, 0, 0.34);
      --base:
        radial-gradient(circle at 58% 46%, rgba(87, 222, 55, 0.34), transparent 18rem),
        radial-gradient(circle at 100% 0%, rgba(10, 52, 34, 0.52), transparent 34rem),
        linear-gradient(118deg, #020807 0%, #061b14 45%, #020504 100%);
      --veil:
        linear-gradient(90deg, rgba(2, 8, 7, 0.96) 0%, rgba(2, 8, 7, 0.78) 42%, rgba(2, 8, 7, 0.22) 74%, transparent 100%);
      --constellation: rgba(97, 255, 72, 0.22);
      --thread: rgba(91, 255, 63, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      color: var(--text);
      background: #e9eee8;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    a,
    button {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .home {
      position: relative;
      min-height: 100svh;
      isolation: isolate;
      overflow: hidden;
      background: var(--base);
    }

    .home::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -4;
      background: var(--veil);
      pointer-events: none;
    }

    .home::after {
      content: "";
      position: absolute;
      inset: -10%;
      z-index: -3;
      background:
        repeating-radial-gradient(circle at 58% 44%, var(--constellation) 0 1px, transparent 1px 48px),
        linear-gradient(155deg, transparent 0 40%, var(--thread) 40.2% 40.5%, transparent 41% 100%),
        linear-gradient(22deg, transparent 0 45%, var(--thread) 45.2% 45.6%, transparent 46% 100%);
      opacity: 0.86;
      pointer-events: none;
    }

    .artifact {
      position: absolute;
      right: clamp(28px, 9vw, 150px);
      top: 50%;
      z-index: -2;
      width: clamp(280px, 34vw, 560px);
      aspect-ratio: 1;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
    }

    .artifact::before {
      content: "";
      position: absolute;
      inset: -18%;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(117, 224, 67, 0.34), transparent 58%);
      filter: blur(10px);
    }

    .artifact::after {
      content: "";
      position: absolute;
      inset: -36%;
      border-radius: 999px;
      background: repeating-radial-gradient(circle, rgba(255, 255, 255, 0.18) 0 1px, transparent 1px 54px);
      opacity: 0.72;
    }

    [data-theme="dark"] .artifact::after {
      background: repeating-radial-gradient(circle, rgba(117, 224, 67, 0.18) 0 1px, transparent 1px 58px);
    }

    .artifact img {
      position: relative;
      z-index: 1;
      width: 74%;
      filter: drop-shadow(0 0 48px rgba(117, 224, 67, 0.64));
      animation: artifactFloat 5.4s ease-in-out infinite;
    }

    .topbar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 30px clamp(18px, 5vw, 76px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(24px, 2.8vw, 36px);
      font-weight: 950;
    }

    .brand img {
      width: 48px;
      height: 48px;
      filter: drop-shadow(0 0 18px rgba(31, 141, 58, 0.42));
    }

    .buttons,
    .copy-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .buttons {
      align-items: center;
      justify-content: flex-end;
    }

    .button {
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--glass);
      color: var(--text);
      padding: 0 20px;
      font-weight: 850;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease;
      white-space: nowrap;
    }

    .button:hover {
      background: var(--glass-strong);
      transform: translateY(-2px);
    }

    .button.panel {
      border-color: transparent;
      background: var(--accent);
      color: var(--panel-text);
      padding-inline: 28px;
    }

    .button.panel:hover {
      background: var(--accent-bright);
    }

    .copy {
      position: absolute;
      left: clamp(20px, 5vw, 80px);
      bottom: clamp(34px, 8vh, 94px);
      z-index: 1;
      width: min(720px, calc(100vw - 40px));
      display: grid;
      gap: 18px;
    }

    .badge {
      width: fit-content;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--glass);
      padding: 10px 15px;
      color: var(--muted);
      font-weight: 850;
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(58px, 9vw, 136px);
      line-height: 0.9;
      font-weight: 980;
      text-wrap: balance;
    }

    p {
      max-width: 550px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(18px, 2vw, 24px);
      line-height: 1.42;
      font-weight: 650;
    }

    .copy-buttons {
      margin-top: 8px;
    }

    @keyframes artifactFloat {
      0%, 100% {
        transform: translateY(0) rotate(0deg) scale(1);
      }

      50% {
        transform: translateY(-14px) rotate(4deg) scale(1.035);
      }
    }

    @media (max-width: 820px) {
      body {
        overflow: auto;
      }

      .topbar {
        padding: 18px;
        align-items: flex-start;
      }

      .brand {
        font-size: 24px;
      }

      .brand img {
        width: 36px;
        height: 36px;
      }

      .buttons {
        gap: 8px;
      }

      .button {
        min-height: 42px;
        padding-inline: 14px;
      }

      .button.secondary {
        display: none;
      }

      .artifact {
        right: 50%;
        top: 38%;
        width: min(340px, 70vw);
        transform: translate(50%, -50%);
      }

      .copy {
        position: relative;
        left: auto;
        bottom: auto;
        min-height: calc(100svh - 88px);
        align-content: end;
        padding: 340px 18px 34px;
        width: 100%;
      }

      h1 {
        font-size: clamp(48px, 16vw, 80px);
      }
    }
  </style>
</head>
<body>
  <main class="home" data-theme="light">
    <div class="artifact" aria-hidden="true">
      <img src="/chipkittle-logo.svg" alt="">
    </div>

    <header class="topbar">
      <a class="brand" href="/">
        <img src="/chipkittle-logo.svg" alt="">
        <span>chipkittle</span>
      </a>

      <nav class="buttons" aria-label="Primary links">
        <button class="button theme-toggle" type="button" aria-pressed="false">Dark</button>
        <a class="button secondary" href="https://github.com/15inb/chipkittle">GitHub</a>
        <a class="button panel" href="https://panel.chipkittle.com">Panel</a>
      </nav>
    </header>

    <section class="copy" aria-label="Chipkittle intro">
      <div class="badge">artifact-grade Discord bot</div>
      <h1>The panel awaits.</h1>
      <p>Configure the bot, tune the rituals, and keep the artifact glowing from one clean control room.</p>
      <div class="copy-buttons">
        <a class="button panel" href="https://panel.chipkittle.com">Open Panel</a>
        <a class="button secondary" href="https://github.com/15inb/chipkittle/blob/main/DEPLOYMENT.md">Deploy Notes</a>
      </div>
    </section>
  </main>

  <script>
    const home = document.querySelector(".home");
    const toggle = document.querySelector(".theme-toggle");
    const savedTheme = localStorage.getItem("chipkittle-theme");

    function setTheme(theme) {
      home.dataset.theme = theme;
      toggle.textContent = theme === "dark" ? "Light" : "Dark";
      toggle.setAttribute("aria-pressed", String(theme === "dark"));
      localStorage.setItem("chipkittle-theme", theme);
    }

    setTheme(savedTheme || "light");
    toggle.addEventListener("click", () => {
      setTheme(home.dataset.theme === "dark" ? "light" : "dark");
    });
  </script>
</body>
</html>
