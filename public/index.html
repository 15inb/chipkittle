<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chipkittle</title>
  <style>
    :root {
      color-scheme: light;
      --text: #11181d;
      --muted: rgba(17, 24, 29, 0.68);
      --button-bg: rgba(255, 255, 255, 0.64);
      --button-border: rgba(17, 24, 29, 0.14);
      --button-hover: rgba(255, 255, 255, 0.84);
      --panel-bg: #1f8d3a;
      --panel-hover: #146728;
      --scrim: linear-gradient(90deg, rgba(247, 248, 242, 0.94) 0%, rgba(247, 248, 242, 0.76) 34%, rgba(247, 248, 242, 0.18) 62%, rgba(247, 248, 242, 0) 100%);
      --fallback-bg:
        radial-gradient(circle at 56% 44%, rgba(88, 222, 55, 0.34), transparent 17rem),
        linear-gradient(118deg, #f7f8f2 0%, #e8eee8 43%, #adb8bb 100%);
      --chipkittle-pos: right 7% bottom 0;
      --chipkittle-size: min(760px, 56vw) auto;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --text: #f4fff5;
      --muted: rgba(244, 255, 245, 0.72);
      --button-bg: rgba(6, 18, 14, 0.58);
      --button-border: rgba(126, 255, 103, 0.18);
      --button-hover: rgba(12, 36, 24, 0.78);
      --panel-bg: #57de37;
      --panel-hover: #b7ff83;
      --scrim: linear-gradient(90deg, rgba(2, 10, 9, 0.94) 0%, rgba(2, 10, 9, 0.78) 38%, rgba(2, 10, 9, 0.24) 66%, rgba(2, 10, 9, 0) 100%);
      --fallback-bg:
        radial-gradient(circle at 57% 50%, rgba(67, 255, 41, 0.28), transparent 18rem),
        radial-gradient(circle at 80% 18%, rgba(31, 141, 58, 0.24), transparent 20rem),
        linear-gradient(118deg, #06110f 0%, #092118 47%, #020808 100%);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100svh;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      background: #eef3ec;
      overflow: hidden;
    }

    a,
    button {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .stage {
      position: relative;
      min-height: 100svh;
      isolation: isolate;
      overflow: hidden;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -3;
      background: var(--fallback-bg);
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        var(--scrim),
        url("/chipkittle.gif") var(--chipkittle-pos) / var(--chipkittle-size) no-repeat;
      pointer-events: none;
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        repeating-radial-gradient(circle at 57% 45%, rgba(255, 255, 255, 0.18) 0 1px, transparent 1px 48px);
      opacity: 0.7;
      pointer-events: none;
    }

    [data-theme="dark"] .grain {
      background:
        repeating-radial-gradient(circle at 57% 48%, rgba(87, 222, 55, 0.22) 0 1px, transparent 1px 52px);
      opacity: 0.85;
    }

    .topbar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 28px clamp(18px, 5vw, 72px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(24px, 2.8vw, 36px);
      font-weight: 950;
      text-shadow: 0 1px 18px rgba(255, 255, 255, 0.45);
    }

    [data-theme="dark"] .brand {
      text-shadow: 0 1px 18px rgba(87, 222, 55, 0.28);
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      filter: drop-shadow(0 0 18px rgba(31, 141, 58, 0.38));
    }

    .buttons {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button,
    .theme-toggle {
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--button-border);
      border-radius: 999px;
      background: var(--button-bg);
      color: var(--text);
      padding: 0 20px;
      font-weight: 850;
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(16px);
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, color 160ms ease;
      white-space: nowrap;
    }

    .button:hover,
    .theme-toggle:hover {
      background: var(--button-hover);
      transform: translateY(-2px);
    }

    .button.panel {
      background: var(--panel-bg);
      border-color: transparent;
      color: white;
      padding-inline: 26px;
    }

    [data-theme="dark"] .button.panel {
      color: #06110f;
    }

    .button.panel:hover {
      background: var(--panel-hover);
    }

    .hero-copy {
      position: absolute;
      left: clamp(20px, 5vw, 80px);
      bottom: clamp(34px, 8vh, 96px);
      z-index: 1;
      max-width: min(650px, calc(100vw - 40px));
      display: grid;
      gap: 18px;
    }

    .badge {
      width: fit-content;
      border: 1px solid var(--button-border);
      border-radius: 999px;
      background: var(--button-bg);
      padding: 10px 15px;
      color: var(--muted);
      font-weight: 850;
      backdrop-filter: blur(14px);
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(56px, 9vw, 132px);
      line-height: 0.91;
      font-weight: 980;
      letter-spacing: 0;
      text-wrap: balance;
    }

    p {
      margin: 0;
      max-width: 540px;
      color: var(--muted);
      font-size: clamp(18px, 2vw, 24px);
      line-height: 1.42;
      font-weight: 600;
    }

    .mobile-bg {
      display: none;
    }

    @media (max-width: 760px) {
      body {
        overflow: auto;
      }

      .stage {
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .stage::after {
        background: var(--scrim);
      }

      .topbar {
        padding: 18px;
        align-items: flex-start;
      }

      .brand {
        font-size: 24px;
      }

      .brand img {
        width: 36px;
        height: 36px;
      }

      .buttons {
        gap: 8px;
      }

      .button,
      .theme-toggle {
        min-height: 42px;
        padding-inline: 14px;
      }

      .button.optional {
        display: none;
      }

      .mobile-bg {
        display: block;
        width: min(430px, 96vw);
        margin: 8px auto 0;
        filter: drop-shadow(0 28px 52px rgba(0, 0, 0, 0.22));
      }

      .hero-copy {
        position: static;
        align-self: end;
        padding: 16px 18px 34px;
      }

      h1 {
        font-size: clamp(48px, 16vw, 78px);
      }
    }
  </style>
</head>
<body>
  <main class="stage" data-theme="light">
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="/">
        <img src="/chipkittle-logo.svg" alt="">
        <span>chipkittle</span>
      </a>

      <nav class="buttons" aria-label="Primary links">
        <a class="button optional" href="https://github.com/15inb/chipkittle">GitHub</a>
        <a class="button optional" href="https://github.com/15inb/chipkittle/blob/main/DEPLOYMENT.md">Deploy</a>
        <button class="theme-toggle" type="button" aria-pressed="false">Dark</button>
        <a class="button panel" href="https://panel.chipkittle.com">Panel</a>
      </nav>
    </header>

    <img class="mobile-bg" src="/chipkittle.gif" alt="A white horned Chipkittle suit">

    <section class="hero-copy" aria-label="Chipkittle landing page">
      <div class="badge">artifact-grade Discord bot</div>
      <h1>Enter the Chipkittle.</h1>
      <p>Open the panel, adjust the rituals, and let the furry horned administrator handle the server business.</p>
    </section>
  </main>

  <script>
    const stage = document.querySelector(".stage");
    const toggle = document.querySelector(".theme-toggle");
    const storedTheme = localStorage.getItem("chipkittle-theme");

    function setTheme(theme) {
      stage.dataset.theme = theme;
      toggle.textContent = theme === "dark" ? "Light" : "Dark";
      toggle.setAttribute("aria-pressed", String(theme === "dark"));
      localStorage.setItem("chipkittle-theme", theme);
    }

    setTheme(storedTheme || "light");
    toggle.addEventListener("click", () => {
      setTheme(stage.dataset.theme === "dark" ? "light" : "dark");
    });
  </script>
</body>
</html>
