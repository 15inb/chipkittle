<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Bread Mines art</title>
  <desc id="desc">A goofy Chipkittle nervously choosing between bread tiles and suspicious mine tiles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#112315"/>
      <stop offset="100%" stop-color="#1f3822"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g transform="translate(130 158)">
    <g fill="#173c1d" stroke="#6ee468" stroke-opacity=".38" stroke-width="4">
      <rect x="0" y="0" width="150" height="150" rx="18"/>
      <rect x="170" y="0" width="150" height="150" rx="18"/>
      <rect x="340" y="0" width="150" height="150" rx="18"/>
      <rect x="0" y="170" width="150" height="150" rx="18"/>
      <rect x="170" y="170" width="150" height="150" rx="18"/>
      <rect x="340" y="170" width="150" height="150" rx="18"/>
    </g>
    <g font-family="Arial, sans-serif" font-weight="900" font-size="84" text-anchor="middle">
      <text x="75" y="100" fill="#73ef69">?</text>
      <text x="245" y="100" fill="#73ef69">2</text>
      <text x="415" y="100" fill="#ff7d7d">X</text>
      <text x="75" y="270" fill="#d79b3b">3</text>
      <text x="245" y="270" fill="#73ef69">?</text>
      <text x="415" y="270" fill="#d79b3b">1</text>
    </g>
  </g>
  <g filter="url(#shadow)" transform="translate(830 430)">
    <ellipse cx="0" cy="120" rx="150" ry="44" fill="#08120b" opacity=".3"/>
    <ellipse cx="0" cy="0" rx="108" ry="128" fill="#f7faf5"/>
    <ellipse cx="0" cy="132" rx="82" ry="38" fill="#f1d0bd"/>
    <ellipse cx="-34" cy="-18" rx="17" ry="24" fill="#101915"/>
    <ellipse cx="34" cy="-18" rx="17" ry="24" fill="#101915"/>
    <circle cx="-34" cy="-18" r="6" fill="#70ef66"/>
    <circle cx="34" cy="-18" r="6" fill="#70ef66"/>
    <path d="M-106 -28 C-122 -108 -74 -178 -20 -188 C-54 -130 -46 -74 -4 -32 Z" fill="#111917"/>
    <path d="M106 -28 C122 -108 74 -178 20 -188 C54 -130 46 -74 4 -32 Z" fill="#111917"/>
    <text x="0" y="86" text-anchor="middle" font-size="38" font-family="Arial, sans-serif" font-weight="700" fill="#101915">uh oh</text>
  </g>
</svg>
