<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Bread Catch art</title>
  <desc id="desc">A funny basket catching bread while a very smug Chipkittle watches cursed junk fall nearby.</desc>
  <defs>
