      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#17311e" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g opacity=".14" stroke="#2a5830" stroke-width="5">
