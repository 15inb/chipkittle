<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bread Catch</title>
  <meta name="description" content="Catch falling bread and dodge cursed junk.">
  <link rel="icon" type="image/svg+xml" href="/chipkittle-logo.svg">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <main class="site-shell interior game-page">
    <header class="topbar">
      <a class="brand" href="/">
        <img src="/notativelogotransparent.png" alt="">
        <span>chipkittle</span>
      </a>
      <nav aria-label="Site navigation">
        <a href="/">Home</a>
        <a href="/members">Members</a>
        <a href="/commits">Commits</a>
        <a href="/game">Games</a>
        <a href="https://discord.gg/zTZwmmCqGc" target="_blank" rel="noreferrer">Discord</a>
      </nav>
      <div class="nav-actions">
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Use dark mode">Dark</button>
        <a class="nav-button" href="https://panel.chipkittle.com">Panel</a>
      </div>
    </header>

    <section class="page-head game-head">
      <p class="eyebrow">Bakery reflex</p>
      <h1>Bread Catch</h1>
      <p>Slide the basket, catch bread, and dodge cursed stones before the timer runs out.</p>
    </section>

    <section class="game-shell" aria-label="Bread Catch game">
      <div class="game-stage">
        <canvas id="catchCanvas" width="960" height="540" aria-label="Bread Catch playfield"></canvas>
      </div>
      <aside class="game-panel">
        <div class="game-stat"><span>Score</span><strong id="scoreValue">0</strong></div>
        <div class="game-stat"><span>Bread</span><strong id="breadValue">0</strong></div>
        <div class="game-stat"><span>Time</span><strong id="timeValue">45</strong></div>
        <label>
          Player name
          <input id="playerName" maxlength="24" autocomplete="nickname" placeholder="Chipkittle name">
        </label>
        <div class="game-controls">
          <button class="button primary" type="button" id="startGame">Start</button>
          <button class="button secondary" type="button" id="resetGame">Reset</button>
        </div>
        <div class="game-status" id="powerupStatus">Power-up: None</div>
        <div class="claim-card" id="claimCard">
          <span>Discord claim</span>
          <small>Catch bread until the round ends to get a claim code.</small>
        </div>
        <div class="leaderboard">
          <div class="leaderboard-head">
            <span>Leaderboard</span>
            <button type="button" id="refreshLeaderboard">Refresh</button>
          </div>
          <ol id="leaderboardList"></ol>
          <small class="game-status" id="leaderboardStatus" hidden></small>
        </div>
      </aside>
    </section>
  </main>

  <script type="module" src="/catch.js"></script>
</body>
</html>
