<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bread Mines</title>
  <meta name="description" content="Reveal bread, avoid cursed mines, and claim what you keep.">
  <link rel="icon" type="image/png" href="/notativelogotransparent.png">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <main class="site-shell interior game-page">
    <header class="topbar">
      <a class="brand" href="/">
        <img src="/notativelogotransparent.png" alt="">
        <span>chipkittle</span>
      </a>
      <nav aria-label="Site navigation">
        <a href="/">Home</a>
        <a href="/members">Members</a>
        <a href="/commits">Commits</a>
        <a href="/game">Games</a>
        <a href="https://discord.gg/zTZwmmCqGc" target="_blank" rel="noreferrer">Discord</a>
      </nav>
      <div class="nav-actions">
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Use dark mode">Dark</button>
        <a class="nav-button" href="https://panel.chipkittle.com">Panel</a>
      </div>
    </header>

    <section class="page-head game-head">
      <p class="eyebrow">Risk board</p>
      <h1>Bread Mines</h1>
      <p>Reveal tiles, bank bread, and cash out before a cursed mine eats the run.</p>
    </section>

    <section class="game-shell mines-shell" aria-label="Bread Mines game">
      <div class="mines-board" id="minesBoard" aria-label="Bread Mines board"></div>
      <aside class="game-panel">
        <div class="game-stat"><span>Score</span><strong id="scoreValue">0</strong></div>
        <div class="game-stat"><span>Bread</span><strong id="breadValue">0</strong></div>
        <div class="game-stat"><span>Safe</span><strong id="safeValue">0</strong></div>
        <label>
          Player name
          <input id="playerName" maxlength="24" autocomplete="nickname" placeholder="Chipkittle name">
        </label>
        <div class="game-controls">
          <button class="button primary" type="button" id="cashOut">Cash Out</button>
          <button class="button secondary" type="button" id="resetGame">New Board</button>
        </div>
        <div class="game-status" id="boonStatus">Boon: None</div>
        <div class="claim-card" id="claimCard">
          <span>Discord claim</span>
          <small>Find bread and cash out to get a claim code.</small>
        </div>
        <div class="leaderboard">
          <div class="leaderboard-head">
            <span>Leaderboard</span>
            <button type="button" id="refreshLeaderboard">Refresh</button>
          </div>
          <ol id="leaderboardList"></ol>
          <small class="game-status" id="leaderboardStatus" hidden></small>
        </div>
      </aside>
    </section>
  </main>

  <script type="module" src="/mines.js"></script>
</body>
</html>
