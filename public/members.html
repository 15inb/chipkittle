<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chipkittle Members</title>
  <meta name="description" content="The public Chipkittle member directory.">
  <link rel="icon" type="image/png" href="/notativelogotransparent.png">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <main class="site-shell interior">
    <header class="topbar">
      <a class="brand" href="/">
        <img src="/notativelogotransparent.png" alt="">
        <span>chipkittle</span>
      </a>
      <nav aria-label="Site navigation">
        <a href="/">Home</a>
        <a href="/status">Status</a>
        <a href="/commands">Commands</a>
        <a href="/archive">Archive</a>
        <a href="/members">Members</a>
        <a href="/commits">Commits</a>
        <a href="/game">Games</a>
        <a href="https://discord.gg/zTZwmmCqGc" target="_blank" rel="noreferrer">Discord</a>
      </nav>
      <div class="nav-actions">
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Use dark mode">Dark</button>
        <a class="nav-button" href="https://panel.chipkittle.com">Panel</a>
      </div>
    </header>

    <section class="page-head">
      <p class="eyebrow">Directory</p>
      <h1>Member Directory</h1>
      <p>The public roster for Chipkittle members, roles, and tiny notes of questionable historical importance.</p>
    </section>

    <section class="directory">
      <div class="member-grid" id="memberGrid">
        <p class="empty">Loading members...</p>
      </div>
    </section>
  </main>

  <script>
    const { readCachedJson, fetchCachedJson } = window.ChipkittleSite;
    const grid = document.querySelector("#memberGrid");
    const panelMembersUrl = "https://panel.chipkittle.com/api/public/members";
    const panelCacheKey = "chipkittle-public-members-v1";
    const panelCacheTtlMs = 10 * 60 * 1000;

    function text(value) {
      return String(value || "").replace(/[&<>"']/g, (match) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[match]));
    }

    async function loadMembers() {
      try {
        const payload = await fetchCachedJson(panelMembersUrl, {
          key: panelCacheKey,
          ttlMs: panelCacheTtlMs
        });
        if (Array.isArray(payload?.members)) {
          return payload.members;
        }
      } catch {}

      const fallbackResponse = await fetch("/members.json");
      return fallbackResponse.ok ? fallbackResponse.json() : [];
    }

    loadMembers()
      .then((members) => {
        if (!Array.isArray(members) || members.length === 0) {
          grid.innerHTML = '<p class="empty">No members are listed yet.</p>';
          return;
        }

        grid.innerHTML = members.map((member) => `
          <article class="member-card">
            <strong>${text(member.name)}</strong>
            <span>${text(member.role || "Member")}</span>
            ${member.title ? `<small>${text(member.title)}</small>` : ""}
            <p>${text(member.bio || "No note yet.")}</p>
            ${(member.badges || []).length ? `<div class="member-badges">${member.badges.map((badge) => `<span>${text(badge)}</span>`).join("")}</div>` : ""}
          </article>
        `).join("");
      })
      .catch(() => {
        grid.innerHTML = '<p class="empty">Could not load the member directory.</p>';
      });
  </script>
</body>
</html>
