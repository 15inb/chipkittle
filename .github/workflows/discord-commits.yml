name: Discord Commit Notifications

on:
  push:
    branches:
      - main

jobs:
  notify:
    name: Post commits to Discord
    runs-on: ubuntu-latest
    steps:
      - name: Send commit summary
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_COMMITS_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          COMPARE_URL: ${{ github.event.compare }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          HEAD_URL: ${{ github.event.head_commit.url }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_COMMITS_WEBHOOK_URL is not configured; skipping Discord notification."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import sys

          webhook_url = os.environ["DISCORD_WEBHOOK_URL"].strip()
          if not webhook_url.startswith("https://discord.com/api/webhooks/"):
              print("DISCORD_COMMITS_WEBHOOK_URL does not look like a Discord webhook URL.")
              sys.exit(1)

          repository = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]
          actor = os.environ["ACTOR"]
          sha = os.environ["SHA"][:7]
          compare_url = os.environ["COMPARE_URL"]
          head_message = os.environ["HEAD_MESSAGE"].splitlines()[0][:256] or "No commit message"
          head_url = os.environ["HEAD_URL"]

          payload = {
              "username": "Chipkittle Commits",
              "allowed_mentions": {"parse": []},
              "embeds": [
                  {
                      "title": f"{repository} updated",
                      "url": compare_url or head_url,
                      "description": f"**{head_message}**",
                      "color": 5887882,
                      "fields": [
                          {"name": "Branch", "value": branch, "inline": True},
                          {"name": "Commit", "value": f"[{sha}]({head_url})", "inline": True},
                          {"name": "Pushed by", "value": actor, "inline": True}
                      ],
                      "footer": {"text": "Chipkittle GitHub"}
                  }
              ]
          }

          with open("discord-payload.json", "w", encoding="utf-8") as file:
              json.dump(payload, file)
          PY

          curl --fail-with-body \
            --show-error \
            --silent \
            --retry 3 \
            --retry-delay 2 \
            --user-agent "GitHubActions-Chipkittle/1.0" \
            --header "Content-Type: application/json" \
            --data @discord-payload.json \
            "$DISCORD_WEBHOOK_URL"
