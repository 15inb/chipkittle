name: Discord Commit Notifications

on:
  push:
    branches:
      - main

jobs:
  notify:
    name: Post commits to Discord
    runs-on: ubuntu-latest
    steps:
      - name: Send commit summary
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_COMMITS_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          HEAD_URL: ${{ github.event.head_commit.url }}
          HEAD_AUTHOR: ${{ github.event.head_commit.author.name }}
          HEAD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_COMMITS_WEBHOOK_URL is not configured; skipping Discord notification."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import sys

          webhook_url = os.environ["DISCORD_WEBHOOK_URL"].strip()
          if not webhook_url.startswith("https://discord.com/api/webhooks/"):
              print("DISCORD_COMMITS_WEBHOOK_URL does not look like a Discord webhook URL.")
              sys.exit(1)

          repository = os.environ["REPOSITORY"]
          actor = os.environ["ACTOR"]
          sha = os.environ["SHA"]
          short_sha = sha[:7]
          commits_url = "https://www.chipkittle.com/commits"
          event_path = os.environ.get("GITHUB_EVENT_PATH")
          event = {}
          if event_path:
              with open(event_path, "r", encoding="utf-8") as file:
                  event = json.load(file)

          commits = event.get("commits") or []
          head_commit = event.get("head_commit") or {}
          def normalize_message(value):
              return (
                  str(value or "")
                  .replace("\\r\\n", "\n")
                  .replace("\\n", "\n")
                  .replace("```", "'")
                  .strip()
              )

          def shorten_lines(lines, max_chars=900, max_lines=8):
              output = []
              total = 0
              for line in lines:
                  cleaned = str(line or "").strip()
                  if not cleaned:
                      continue
                  if total + len(cleaned) + 1 > max_chars:
                      output.append("+ ...more on the public commit page")
                      break
                  output.append(cleaned)
                  total += len(cleaned) + 1
                  if len(output) >= max_lines:
                      output.append("+ ...more on the public commit page")
                      break
              return "\n".join(output) or "+ No details provided"

          def humanize_change_line(value):
              cleaned = str(value or "").strip()
              if not cleaned:
                  return ""
              cleaned = cleaned.replace("\\n", " ").replace("\t", " ")
              cleaned = cleaned.strip("`").strip()
              if cleaned.startswith("@@") or cleaned.startswith("diff --git") or cleaned.startswith("index "):
                  return ""
              cleaned = cleaned.lstrip("+-* ").strip()
              if not cleaned:
                  return ""
              if len(cleaned) > 170:
                  cleaned = cleaned[:167].rstrip() + "..."
              return cleaned

          def bullet_lines(lines, max_chars=900, max_lines=8):
              cleaned_lines = []
              for line in lines:
                  cleaned = humanize_change_line(line)
                  if not cleaned:
                      continue
                  cleaned_lines.append(f"- {cleaned}")
              text = shorten_lines(cleaned_lines, max_chars=max_chars, max_lines=max_lines)
              return text.replace("+ ...more on the public commit page", "- More on the public commit page").replace("+ No details provided", "- No details provided")

          head_message_full = normalize_message(head_commit.get("message") or os.environ["HEAD_MESSAGE"] or "")
          head_message = (head_message_full.splitlines()[0] if head_message_full else "No commit message")[:180]

          if head_message.strip().lower().startswith("silent"):
              print("Commit message starts with 'silent'; skipping Discord notification.")
              sys.exit(0)

          author = os.environ.get("HEAD_AUTHOR") or actor

          added = set()
          modified = set()
          removed = set()
          changelog_lines = []
          commit_lines = []
          category_lines = {
              "Panel": [],
              "Bot": [],
              "Public site": [],
              "Games": [],
              "Config/CI": [],
              "Other": [],
          }

          def commit_category(title, changed_files):
              haystack = f"{title} {' '.join(changed_files)}".lower()
              if any(token in haystack for token in ["panel", "oauth", "access", "audit", "session"]):
                  return "Panel"
              if any(token in haystack for token in ["public/", "website", "homepage", "site.css", "commits.html", "status.html", "members.html", "relax"]):
                  return "Public site"
              if any(token in haystack for token in ["8ball", "runner", "dash", "mines", "catch", "loaf", "game"]):
                  return "Games"
              if any(token in haystack for token in [".github", "workflow", "deploy", "package", "config", "env"]):
                  return "Config/CI"
              if any(token in haystack for token in ["command", "bot", "ai", "economy", "gambling", "moderation", "ticket", "application", "tts"]):
                  return "Bot"
              return "Other"

          for commit in commits[-8:]:
              message = normalize_message(commit.get("message") or "")
              title, *body_lines = message.splitlines()
              title = (title or "Untitled commit")[:120]
              commit_sha = (commit.get("id") or "")[:7]
              commit_author = (commit.get("author") or {}).get("name") or author
              changed_files = [
                  *(commit.get("added") or []),
                  *(commit.get("modified") or []),
                  *(commit.get("removed") or []),
              ]
              category = commit_category(title, changed_files)
              category_lines[category].append(f"{title} ({commit_sha})")
              commit_lines.append(f"{title} ({commit_sha} by {commit_author})")

              for line in body_lines:
                  cleaned = humanize_change_line(line)
                  if cleaned:
                      changelog_lines.append(cleaned)

              added.update(commit.get("added") or [])
              modified.update(commit.get("modified") or [])
              removed.update(commit.get("removed") or [])

          if not commit_lines:
              commit_lines = [f"{head_message} ({short_sha} by {author})"]

          if not changelog_lines:
              generated = []
              if added:
                  generated.append(f"Added {len(added)} file{'s' if len(added) != 1 else ''}")
              if modified:
                  generated.append(f"Updated {len(modified)} file{'s' if len(modified) != 1 else ''}")
              if removed:
                  generated.append(f"Removed {len(removed)} file{'s' if len(removed) != 1 else ''}")
              changelog_lines = generated or commit_lines[:6]

          file_sections = []
          if added:
              file_sections.append("Added: " + ", ".join(sorted(added)[:8]))
          if modified:
              file_sections.append("Changed: " + ", ".join(sorted(modified)[:8]))
          if removed:
              file_sections.append("Removed: " + ", ".join(sorted(removed)[:8]))

          file_summary = shorten_lines(file_sections, max_chars=950, max_lines=6) if file_sections else "Files changed are listed on the public commit page."
          commit_count = len(commits) or 1
          category_block_lines = []
          for category, lines in category_lines.items():
              if lines:
                  category_block_lines.append(f"{category}:")
                  category_block_lines.extend(lines[:5])
          changelog_block = bullet_lines(changelog_lines, max_chars=1000, max_lines=8)
          category_block = bullet_lines(category_block_lines, max_chars=800, max_lines=10)
          commit_block = bullet_lines(commit_lines, max_chars=900, max_lines=8)

          relative_time = "Just now"
          timestamp = os.environ.get("HEAD_TIMESTAMP")
          if timestamp:
              from datetime import datetime, timezone

              commit_time = datetime.fromisoformat(timestamp.replace("Z", "+00:00"))
              seconds = max(0, int((datetime.now(timezone.utc) - commit_time).total_seconds()))
              if seconds >= 86400:
                  days = seconds // 86400
                  relative_time = f"{days} day{'s' if days != 1 else ''} ago"
              elif seconds >= 3600:
                  hours = seconds // 3600
                  relative_time = f"{hours} hour{'s' if hours != 1 else ''} ago"
              elif seconds >= 60:
                  minutes = seconds // 60
                  relative_time = f"{minutes} minute{'s' if minutes != 1 else ''} ago"

          fields = [
              {
                  "name": "What changed",
                  "value": changelog_block[:1024],
                  "inline": False
              },
              {
                  "name": "Files touched",
                  "value": file_summary[:1024],
                  "inline": False
              }
          ]

          if commit_count > 1:
              fields.insert(1, {
                  "name": "Areas",
                  "value": category_block[:1024],
                  "inline": False
              })
              fields.insert(2, {
                  "name": "Commits included",
                  "value": commit_block[:1024],
                  "inline": False
              })

          payload = {
              "username": "[CK] Commits",
              "allowed_mentions": {"parse": []},
              "embeds": [
                  {
                      "title": f"Chipkittle Update - {commit_count} commit{'s' if commit_count != 1 else ''}",
                      "url": commits_url,
                      "description": (
                          f"**{relative_time}**\n\n"
                          f"[View the public commit page]({commits_url})"
                      ),
                      "color": 3447003,
                      "fields": fields,
                      "footer": {"text": f"Latest by {author} | {short_sha} | {repository}"}
                  }
              ]
          }

          with open("discord-payload.json", "w", encoding="utf-8") as file:
              json.dump(payload, file)
          PY

          curl --fail-with-body \
            --show-error \
            --silent \
            --retry 3 \
            --retry-delay 2 \
            --user-agent "GitHubActions-Chipkittle/1.0" \
            --header "Content-Type: application/json" \
            --data @discord-payload.json \
            "$DISCORD_WEBHOOK_URL"
